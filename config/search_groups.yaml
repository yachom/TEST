# STO 기초자산 감성평가 — 뉴스 검색어 그룹 설정
# 검색어를 수정하려면 이 파일만 편집하면 된다. 코드를 수정하지 않는다.

active_asset_classes:
  - commercial   # 현재 MVP 대상

groups:

  # -----------------------------------------------------------------------
  # 1. 공통 STO 제도 신호 — 자산군 무관, 항상 활성화
  # -----------------------------------------------------------------------
  - name: sto_system_common
    active: true
    priority: 1
    schedule_type: daily
    provider: naver
    asset_family: null
    asset_class: null
    max_display: 10
    max_pages: 1
    sort: date
    post_process: true
    enable_llm_tagging: true
    queries:
      - 토큰증권 제도화
      - 조각투자 증권
      - 투자계약증권
      - 토큰증권 유통
      - STO 투자자 보호
      - 장외거래중개업
      - 발행인 계좌관리기관
      - 토큰증권 발행

  # -----------------------------------------------------------------------
  # 2. 거시 금융환경 신호 — 자산군 무관, 배경 맥락
  # -----------------------------------------------------------------------
  - name: macro_financial
    active: true
    priority: 2
    schedule_type: daily
    provider: naver
    asset_family: null
    asset_class: null
    max_display: 10
    max_pages: 1
    sort: date
    post_process: true
    enable_llm_tagging: true
    queries:
      - 기준금리 부동산
      - 국고채 금리 부동산
      - 부동산 PF 리스크
      - 상업용 부동산 대출
      - 대체투자 시장
      - 부동산 투자심리
      - 유동성 부동산 시장

  # -----------------------------------------------------------------------
  # 3. 상업용 부동산 시장 신호 — MVP 핵심 그룹
  # -----------------------------------------------------------------------
  - name: commercial_real_estate_market
    active: true
    priority: 3
    schedule_type: daily
    provider: naver
    asset_family: real_estate
    asset_class: commercial
    max_display: 10
    max_pages: 2
    sort: date
    post_process: true
    enable_llm_tagging: true
    queries:
      - 상업용 부동산 시장
      - 상업용 부동산 거래량
      - 상업용 부동산 공실률
      - 상업용 부동산 임대료
      - 상업용 부동산 투자수익률
      - 상가 공실률
      - 상가 임대료
      - 상가 거래량
      - 상가 임대수익률
      - 상가 매물 증가

  # -----------------------------------------------------------------------
  # 4. 임차인 업황 신호
