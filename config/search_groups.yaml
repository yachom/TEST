      - 상권 활성화 사업
      - 도시재생 사업

  # -----------------------------------------------------------------------
  # 향후 추가 예정 — 비활성 상태로 준비
  # -----------------------------------------------------------------------
  - name: residential_real_estate_market
    active: false
    priority: 10
