  - name: tenant_business_conditions
    active: true
    priority: 4
    schedule_type: daily
    provider: naver
    asset_family: real_estate
    asset_class: commercial
    max_display: 10
    max_pages: 1
    sort: date
    post_process: true
    enable_llm_tagging: true
    queries:
      - 자영업 폐업
      - 소상공인 폐업
      - 소상공인 매출 감소
      - 소상공인 매출 회복
      - 외식업 폐업
      - 카페 폐업
      - 소상공인 대출 연체
      - 소비 침체 자영업

  # -----------------------------------------------------------------------
  # 5. 상업용 부동산 규제 신호
